# patterns.yaml
# Includes standard polished patterns for cabinets / dashboards.

EmptyState:
  required: [title, description]
  optional: [action, icon]
  icon: "Tabler icon preferred"
  never:
    - "just the text 'No data' or 'Nothing found' without explanation"
    - "emoji as the only visual"

LoadingState:
  required: [indicator]
  prefer: "skeleton or spinner from tokens"
  never:
    - "different loaders on different screens without reason"

ErrorState:
  required: [title, description]
  optional: [retry_action, icon]
  icon: "Tabler icon preferred"
  never:
    - "just 'Error' or technical text"

List:
  states: [loading, empty, error, populated]
  never:
    - "infinite list without pagination or virtualization on large data"

Form:
  states: [idle, submitting, success, error]
  never:
    - "submit without state indication"
    - "errors only in alert, without binding to fields"

# Cabinet / Dashboard standards (use these by default for admin UIs)

ModalDialog:
  description: "Focused overlay for confirmations or short forms"
  footer: "max 2 buttons"
  layout: "title + content + actions aligned consistently"
  never:
    - "three or more buttons"
    - "cramped or random button order"

CardGrid:
  description: "Responsive grid of cards"
  columns: "auto-fit with consistent gap from spacing scale"
  cards: "use Card component with consistent elevation"
  never:
    - "no grid, just stacked or random placement"
    - "ugly flat cards without hierarchy"

DataTable:
  description: "Tabular data with consistent styling"
  states: [loading, empty, error, populated]
  features: "optional sorting, pagination, row actions with Tabler icons"

SidebarLayout:
  description: "Typical cabinet navigation + content"
  nav: "consistent items with Tabler icons"
  content: "clear max-width or fluid with proper padding"

# When transforming an existing cabinet, prefer these patterns to create visual polish and consistency.
