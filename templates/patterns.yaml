# patterns.yaml
# Standard polished patterns. Use these by default when transforming cabinets or generating pages.

patterns:
  ModalDialog:
    description: "Standard modal with clear primary action"
    rules:
      - maximum 2 buttons in footer (primary + secondary/cancel)
      - clear title and description
      - soft elevation
      - consistent padding from density system
    states: [loading, empty, error]

  Card:
    description: "Elevated or softly separated card"
    rules:
      - consistent padding from density
      - soft radius
      - prefer subtle shadow or surface over hard border
      - clear hierarchy inside
    states: [loading, empty, error]

  CardGrid:
    description: "Grid of cards with consistent gap"
    rules:
      - use grid_gap from density system
      - equal visual weight or intentional hierarchy
      - no random spacing

  DataTable:
    description: "Readable data table or list"
    rules:
      - consistent row height and padding
      - clear column alignment
      - muted secondary text
      - empty and loading states

  SidebarLayout:
    description: "Cabinet layout with sidebar + content"
    rules:
      - sidebar width from density system
      - consistent content padding
      - clear active state

  EmptyState:
    description: "Friendly empty state"
    rules:
      - icon (Tabler) + title + short description
      - optional primary action
      - not centered wall of text

  FormSection:
    description: "Grouped form fields"
    rules:
      - consistent field spacing
      - clear labels
      - validation states
