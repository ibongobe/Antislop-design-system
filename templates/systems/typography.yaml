# typography.yaml
# Density-dependent type scale. Font family always from user input.

compact:
  size:
    xs: "11px"
    sm: "12px"
    base: "14px"
    lg: "16px"
    xl: "18px"
    "2xl": "20px"
  line_height: "1.3"
  note: "Tighter type for dense UIs"

normal:
  size:
    xs: "12px"
    sm: "14px"
    base: "16px"
    lg: "18px"
    xl: "20px"
    "2xl": "24px"
  line_height: "1.5"
  note: "Standard readable scale"

airy:
  size:
    xs: "13px"
    sm: "15px"
    base: "17px"
    lg: "20px"
    xl: "24px"
    "2xl": "32px"
  line_height: "1.6"
  note: "Larger, more open type for spacious interfaces"
