# radius.yaml
# Three density systems. Prefer softer, larger radii like HeroUI (base ~8px, fields ~12px).
# Avoid tiny sharp corners.

compact:
  sm: "4px"
  md: "6px"
  lg: "8px"
  xl: "12px"
  full: "9999px"
  note: "Still reasonably soft even in dense mode"

normal:
  sm: "6px"
  md: "8px"
  lg: "12px"
  xl: "16px"
  full: "9999px"
  note: "HeroUI-like balanced radii"

airy:
  sm: "8px"
  md: "12px"
  lg: "16px"
  xl: "24px"
  full: "9999px"
  note: "Soft, generous radii"
