# Matching logic (for agent):
# 1. If user gives exact hex or brand name — use or adapt the closest preset.
# 2. Generate consistent neutrals (surface, muted, border) from the accent if needed.
# 3. Always include success / warning / danger that work with the accent.
# 4. Mark source and density compatibility.
