# colors.yaml
# Ready palettes inspired by Mobbin brand colors (https://mobbin.com/colors/brand).
# When user provides hex or brand colors, find the closest preset and adapt neutrals consistently.
# Always generate full semantic set: background, surface, text, border, accent, status.

presets:
