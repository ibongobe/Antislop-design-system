# colors.yaml
# Soft neutral base. Prefer surface hierarchy over hard borders.
# Adapt accent from user brand when provided. Keep neutrals consistent.

default:
  name: "Soft neutral"
  background: "#F7F7F8"
  surface: "#FFFFFF"
  surface_secondary: "#F3F4F6"
  surface_tertiary: "#EBECEF"
  text_primary: "#111827"
  text_secondary: "#6B7280"
  border: "#E5E7EB"
  separator: "#F0F0F1"
  accent: "#2563EB"
  danger: "#DC2626"
  success: "#16A34A"
  warning: "#D97706"
  note: "Default soft palette. Prefer surfaces over strong borders."

presets:
  airbnb:
    name: "Warm accent"
    accent: "#FF385C"
    background: "#FFFFFF"
    surface: "#F7F7F7"
    text_primary: "#222222"
    text_secondary: "#717171"
    border: "#E5E5E5"

  stripe:
    name: "Fintech blue"
    accent: "#635BFF"
    background: "#FFFFFF"
    surface: "#F6F9FC"
    text_primary: "#0A2540"
    text_secondary: "#425466"
    border: "#E3E8EE"

  linear:
    name: "Product blue"
    accent: "#5E6AD2"
    background: "#FFFFFF"
    surface: "#F7F8F8"
    text_primary: "#11181C"
    text_secondary: "#687076"
    border: "#DFE3E6"

# Matching logic:
# 1. Default to the soft neutral set.
# 2. If user gives brand hex — pick closest preset accent and keep the soft neutral structure.
# 3. Prefer subtle borders / surface hierarchy. Avoid heavy black borders.
# 4. Always generate full semantic set (background, surface, text, border, accent, status).
